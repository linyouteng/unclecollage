[build]
  command = ""
  publish = "."

[functions]
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "18"


# Permanently redirect the legacy Netlify hostname to the official custom domain.
# Keep the original path (for example /gallery.html, /p/abc, or /20260528-001).
[[redirects]]
  from = "https://unclecollage.netlify.app/*"
  to = "https://photos.naturaluncle.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/p/*"
  to = "/.netlify/functions/share/:splat"
  status = 200

# New short public link format, for example: /20260528-001
# Existing files such as /index.html and /gallery.html continue to be served normally.
[[redirects]]
  from = "/:slug"
  to = "/.netlify/functions/share/:slug"
  status = 200
